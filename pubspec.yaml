name: flutter_sabel
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_bloc: ^9.1.1
  cupertino_icons: ^1.0.8
  dio: ^5.11.0
  shared_preferences: ^2.5.5
  url_launcher: ^6.2.0
  in_app_review: ^2.0.12
  equatable: ^2.1.0
  get_it: ^9.2.1
  sqflite: ^2.4.3
  path: ^1.9.1
  path_provider: ^2.1.6
  firebase_core: ^4.13.0
  cloud_firestore: ^6.8.0
  image_picker: ^1.2.3
  record: ^7.1.1
  audioplayers: ^6.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^6.0.0
  rename_app: ^1.6.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"

rename_app:
  application_name: "SABEL"

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/